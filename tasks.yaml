Entry point should answer all the following:
 - The previous trend should be on the last 2 hours.
 - Starts the trend in terms of volume.
 - High volume relatively to its previous bar.
 - close strongly - upper wick is small if any at all.
 - cross the previous VAH of the previous trend.
 - close of current bar is the highest close for the current day.
 - If the first move is very high, we need to look on this very causion.


Theories to test:
 - pre market early trend, price does not cross the VAL, and crossed later the VAH but doesnt keep the price up as a new trend.
 - trend, and short time after than price does not cross the VAL, suddenly volume gets high and VAH crossed - trend continues.
 - early trend on market, price retest the VAL and does not cross it, resistance line above VAH but a clear one - when crossing this line strongly the trend continues.

 - There are 2 valid scenarios:
  - previous trend is close, price does not crossed down from VAL, and volume comes early to continue the trend.
  - previous trend is not so close, take the VAH and search for crossing it strongly. if not crossed strongly but crossed, wait for retest.
