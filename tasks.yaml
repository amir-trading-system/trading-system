Get in only if the following happens:
 - close is above last VAH.
 - volume is much bigger than previous, and above volume average.
 - close above previous resistance (by other close, not high).
 - bar close strongly - wick less than 0.4.
 - not in the first 10 minutes if its a good one there will be another option later.
 examples:
  - CRVO - 06.16.2026T11:01:00 - True.
  - CRVO - 06.16.2026T12:18:00 - False - volume is not so high while price is wide - meaning not a lot of buyers.
  - CRVO - 06.16.2026T12:24:00 - True.
